name: Generate Pink QA Snake

on:
  schedule:
    - cron: "0 */24 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate pink contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FFD1E6&color_dots=%23161B22,%23451B32,%238A315F,%23D94F9D,%23FF85C2
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FFD1E6&color_dots=%23161B22,%23451B32,%238A315F,%23D94F9D,%23FF85C2

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
